<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百名店 Nearby Finder — Find Tabelog Hyakumeiten Near You</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --primary: #E44040;
            --primary-dark: #C13535;
            --bg: #F5F5F5;
            --card-bg: #FFFFFF;
            --text: #1A1A1A;
            --text-secondary: #666;
            --border: #E0E0E0;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }

        /* Header */
        header { background: var(--primary); color: white; padding: 16px 20px; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        header h1 { font-size: 1.3rem; display: flex; align-items: center; gap: 8px; }
        header h1 span { font-size: 1.5rem; }
        .subtitle { font-size: 0.85rem; opacity: 0.9; margin-top: 4px; }

        /* Controls */
        .controls { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 12px 16px; position: sticky; top: 70px; z-index: 999; }
        .controls-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .btn { padding: 8px 14px; border: none; border-radius: var(--radius); cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; transition: all 0.2s; white-space: nowrap; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: var(--bg); }
        .btn-outline.active { background: #FFF3E0; border-color: #FF9800; color: #E65100; }
        .btn-outline.active-scenic { background: #E8F5E9; border-color: #4CAF50; color: #2E7D32; }
        .search-input { flex: 1; min-width: 150px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.9rem; }
        .search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px rgba(228,64,64,0.1); }
        .stats { font-size: 0.8rem; color: var(--text-secondary); margin-left: auto; }

        /* Main layout */
        .main { display: flex; height: calc(100vh - 140px); }
        #map { flex: 1; min-height: 300px; }
        .sidebar { width: 380px; background: var(--card-bg); overflow-y: auto; border-left: 1px solid var(--border); }

        /* Restaurant cards */
        .restaurant-card { padding: 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
        .restaurant-card:hover { background: #FFF5F5; }
        .restaurant-card.highlighted { background: #FFF0F0; border-left: 3px solid var(--primary); }
        .card-header { display: flex; gap: 12px; }
        .card-image { width: 80px; height: 60px; border-radius: 6px; object-fit: cover; background: #EEE; flex-shrink: 0; }
        .card-info { flex: 1; min-width: 0; }
        .card-name { font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
        .new-badge { background: #FFD700; color: #333; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
        .famous-badge { background: #FF6B00; color: white; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
        .card-area { font-size: 0.8rem; color: var(--text-secondary); }
        .card-meta { display: flex; gap: 12px; margin-top: 6px; font-size: 0.8rem; }
        .card-meta span { display: flex; align-items: center; gap: 4px; }
        .card-genre { display: inline-block; background: var(--bg); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin-top: 6px; }
        .card-distance { color: var(--primary); font-weight: 600; }
        .card-actions { display: flex; gap: 8px; margin-top: 8px; }
        .card-actions a { font-size: 0.8rem; color: var(--primary); text-decoration: none; padding: 4px 0; }
        .card-actions a:hover { text-decoration: underline; }

        /* Scenic spot cards */
        .scenic-card { padding: 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
        .scenic-card:hover { background: #F0FFF0; }
        .scenic-card.highlighted { background: #E8F5E9; border-left: 3px solid #4CAF50; }
        .scenic-header { display: flex; gap: 12px; align-items: center; }
        .scenic-emoji { font-size: 2rem; flex-shrink: 0; }
        .scenic-info { flex: 1; min-width: 0; }
        .scenic-name { font-weight: 600; font-size: 0.95rem; }
        .scenic-name-ja { font-size: 0.85rem; color: var(--text-secondary); }
        .scenic-category { display: inline-block; background: #E8F5E9; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; margin-top: 6px; color: #2E7D32; }
        .scenic-actions { display: flex; gap: 8px; margin-top: 8px; }
        .scenic-actions a { font-size: 0.8rem; color: #4CAF50; text-decoration: none; padding: 4px 0; }
        .scenic-actions a:hover { text-decoration: underline; }

        /* Loading & empty states */
        .loading { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .loading .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }

        /* Responsive */
        @media (max-width: 768px) {
            .main { flex-direction: column; height: auto; }
            #map { height: 40vh; min-height: 250px; }
            .sidebar { width: 100%; max-height: 50vh; }
            .controls { position: static; }
            header { position: static; }
        }

        /* Leaflet custom */
        .leaflet-popup-content-wrapper { border-radius: var(--radius); }
        .popup-content { padding: 4px; }
        .popup-content h4 { margin-bottom: 4px; }
        .popup-content p { font-size: 0.85rem; color: var(--text-secondary); }

        /* Emoji markers */
        .emoji-marker {
            display: flex; align-items: center; justify-content: center;
            width: 32px; height: 32px; border-radius: 50%;
            font-size: 18px; border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            color: white; font-weight: bold;
        }
        .scenic-marker-wrap {
            display: flex; flex-direction: column; align-items: center;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            cursor: pointer;
            transition: transform 0.15s;
        }
        .scenic-marker-wrap:hover { transform: scale(1.15); }
        .scenic-marker-icon {
            display: flex; align-items: center; justify-content: center;
            width: 30px; height: 30px;
            background: rgba(255,255,255,0.92);
            border: 2px solid #4CAF50;
            border-radius: 50%;
            font-size: 16px;
        }
        .scenic-marker-label {
            font-size: 10px; color: #1f2937; font-weight: 600;
            background: rgba(255,255,255,0.9);
            padding: 1px 4px; border-radius: 3px;
            margin-top: 2px;
            max-width: 70px; text-align: center;
            line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* Bottom sheet popup (jp-foodmap style) */
        #bs-backdrop {
            position: fixed; inset: 0; z-index: 10001;
            background: rgba(0,0,0,0.35);
            opacity: 0; pointer-events: none;
            transition: opacity 0.22s ease-out;
        }
        #bs-backdrop.bs-open { opacity: 1; pointer-events: auto; }
        #bs-sheet {
            position: fixed; left: 0; right: 0; bottom: 0;
            z-index: 10002;
            max-height: 75vh; max-height: 75dvh;
            background: #fff;
            border-radius: 14px 14px 0 0;
            box-shadow: 0 -8px 24px rgba(0,0,0,0.18);
            transform: translateY(100%);
            transition: transform 0.25s ease-out;
            display: flex; flex-direction: column;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding-bottom: env(safe-area-inset-bottom);
        }
        #bs-sheet.bs-open { transform: translateY(0); }
        @media (min-width: 700px) {
            #bs-sheet { left: 50%; transform: translate(-50%, 100%);
                        max-width: 680px; right: auto;
                        max-height: 80vh; max-height: 80dvh;
                        border-radius: 14px 14px 0 0; }
            #bs-sheet.bs-open { transform: translate(-50%, 0); }
        }
        @media (min-width: 1100px) {
            #bs-sheet { max-width: 880px;
                        max-height: 85vh; max-height: 85dvh; }
        }
        #bs-grip {
            position: relative;
            padding: 9px 0 6px; flex-shrink: 0;
            cursor: grab; touch-action: none;
        }
        #bs-grip::before {
            content: ''; display: block;
            width: 38px; height: 4px; margin: 0 auto;
            background: #d1d5db; border-radius: 2px;
        }
        #bs-close {
            position: absolute; top: 4px; right: 6px;
            background: none; border: none;
            font-size: 22px; line-height: 1; color: #9ca3af;
            cursor: pointer; padding: 4px 10px;
        }
        #bs-close:hover { color: #374151; }
        #bs-content {
            overflow-y: auto;
            padding: 0 14px 14px;
            flex: 1 1 auto;
            -webkit-overflow-scrolling: touch;
        }
        /* Restaurant detail card */
        .rst-card { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                    font-size: 13px; color: #1f2937; }
        .rst-header { display: flex; justify-content: space-between;
                      align-items: flex-start; gap: 8px; margin-bottom: 8px; }
        .rst-title { font-weight: 700; font-size: 16px; flex: 1; min-width: 0;
                     line-height: 1.3; }
        .rst-title .rst-rating { color: #c33; margin-left: 4px; font-weight: 700; }
        .rst-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .rst-photos { display: grid; grid-template-columns: repeat(3, 1fr);
                      gap: 6px; margin-bottom: 10px; }
        .rst-photos a { display: block; min-width: 0; }
        .rst-photos img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
                          border-radius: 6px; display: block; background: #f3f4f6; }
        .rst-genre { color: #4b5563; margin-bottom: 8px; }
        .rst-info { display: grid; grid-template-columns: 1fr;
                    gap: 4px 16px; margin-bottom: 8px; }
        .rst-info-row { display: flex; gap: 6px; align-items: baseline;
                        line-height: 1.45; }
        .rst-info-row .rst-label { color: #9ca3af; flex-shrink: 0;
                                   font-size: 12px; min-width: 38px; }
        .rst-info-row .rst-value { color: #1f2937; min-width: 0;
                                   overflow-wrap: anywhere; }
        .rst-policy { font-size: 12px; color: #6b7280; line-height: 1.5;
                      margin-bottom: 8px; }
        .rst-footer { display: flex; justify-content: space-between;
                      align-items: center; gap: 8px; flex-wrap: wrap; }
        .rst-footer a { color: #2563eb; text-decoration: none; font-size: 13px; }
        .rst-footer a:hover { text-decoration: underline; }
        .rst-chip { background: #3b9c4f; color: #fff; padding: 2px 8px;
                    border-radius: 4px; font-size: 11px; font-weight: 500; }
        .rst-chip.rst-chip-off { background: #9ca3af; }
        .rst-btn { padding: 4px 10px; font-size: 12px; cursor: pointer;
                   border: 1px solid #d1d5db; border-radius: 5px;
                   background: #f9fafb; color: #1f2937; }
        .rst-btn:hover { background: #f3f4f6; }
        @media (min-width: 700px) {
            .rst-card { font-size: 14px; }
            .rst-title { font-size: 18px; }
            .rst-photos { gap: 8px; }
        }
        @media (min-width: 1100px) {
            #bs-content { padding: 0 22px 22px; }
            .rst-card { font-size: 14px; }
            .rst-title { font-size: 20px; }
            .rst-info { grid-template-columns: 1fr 1fr; column-gap: 24px; }
        }

        /* Scenic spot detail in bottom sheet */
        .scenic-detail { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        .scenic-detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .scenic-detail-emoji { font-size: 3rem; }
        .scenic-detail-title { font-weight: 700; font-size: 18px; }
        .scenic-detail-subtitle { font-size: 14px; color: #6b7280; }
        .scenic-detail-info { display: grid; gap: 8px; margin-bottom: 12px; }
        .scenic-detail-row { display: flex; gap: 8px; align-items: baseline; }
        .scenic-detail-label { color: #9ca3af; font-size: 12px; min-width: 40px; }
        .scenic-detail-value { color: #1f2937; }
        .scenic-detail-footer { display: flex; gap: 8px; }
        .scenic-detail-footer a { color: #2563eb; text-decoration: none; font-size: 13px; }
        .scenic-detail-footer a:hover { text-decoration: underline; }

        /* Genre dropdown */
        .genre-dropdown { position: relative; }
        .genre-menu { display: none; position: absolute; top: 100%; left: 0; background: white; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); max-height: 300px; overflow-y: auto; z-index: 1001; min-width: 200px; padding: 8px; }
        .genre-menu.show { display: block; }
        .genre-menu-item { padding: 6px 12px; cursor: pointer; font-size: 0.85rem; border-radius: 4px; display: flex; justify-content: space-between; }
        .genre-menu-item:hover { background: var(--bg); }
        .genre-menu-item.active { background: var(--primary); color: white; }
        .genre-count { color: var(--text-secondary); font-size: 0.75rem; }
        .genre-menu-item.active .genre-count { color: rgba(255,255,255,0.8); }

        /* Price filter dropdown */
        .price-dropdown { position: relative; }
        .price-menu { display: none; position: absolute; top: 100%; left: 0; background: white; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); z-index: 1001; min-width: 260px; padding: 12px; }
        .price-menu.show { display: block; }
        .price-section { margin-bottom: 10px; }
        .price-section:last-child { margin-bottom: 0; }
        .price-label { font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: var(--text-secondary); }
        .price-row { display: flex; align-items: center; gap: 6px; }
        .price-input { width: 65px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.8rem; text-align: center; }
        .price-sep { color: var(--text-secondary); font-size: 0.8rem; }
        .price-presets { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
        .price-preset { padding: 2px 8px; font-size: 0.7rem; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; background: var(--bg); }
        .price-preset:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .price-preset.active { background: var(--primary); color: white; border-color: var(--primary); }
        .price-clear { font-size: 0.75rem; color: var(--text-secondary); cursor: pointer; margin-top: 6px; text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <h1><span>🌟</span> 百名店 Nearby Finder</h1>
        <div class="subtitle">Find Tabelog Hyakumeiten (食べログ百名店) restaurants near you</div>
    </header>

    <div class="controls">
        <div class="controls-row">
            <button class="btn btn-primary" id="locateBtn">📍 Near Me</button>
            <input type="text" class="search-input" id="searchInput" placeholder="Search restaurant name...">
            <input type="text" class="search-input" id="addressInput" placeholder="Search by city/address..." style="max-width: 200px;">
            <div class="genre-dropdown">
                <button class="btn btn-outline" id="genreBtn">🍜 Genre ▾</button>
                <div class="genre-menu" id="genreMenu"></div>
            </div>
            <div class="price-dropdown">
                <button class="btn btn-outline" id="priceBtn">💰 Price ▾</button>
                <div class="price-menu" id="priceMenu">
                    <div class="price-section">
                        <div class="price-label">🌞 Lunch</div>
                        <div class="price-row">
                            <input type="number" class="price-input" id="lunchMin" placeholder="Min" min="0" step="100">
                            <span class="price-sep">～</span>
                            <input type="number" class="price-input" id="lunchMax" placeholder="Max" min="0" step="100">
                            <span class="price-sep">¥</span>
                        </div>
                        <div class="price-presets" id="lunchPresets">
                            <span class="price-preset" data-max="1000">~¥1K</span>
                            <span class="price-preset" data-max="3000">~¥3K</span>
                            <span class="price-preset" data-max="5000">~¥5K</span>
                            <span class="price-preset" data-max="10000">~¥10K</span>
                        </div>
                    </div>
                    <div class="price-section">
                        <div class="price-label">🌙 Dinner</div>
                        <div class="price-row">
                            <input type="number" class="price-input" id="dinnerMin" placeholder="Min" min="0" step="100">
                            <span class="price-sep">～</span>
                            <input type="number" class="price-input" id="dinnerMax" placeholder="Max" min="0" step="100">
                            <span class="price-sep">¥</span>
                        </div>
                        <div class="price-presets" id="dinnerPresets">
                            <span class="price-preset" data-max="3000">~¥3K</span>
                            <span class="price-preset" data-max="5000">~¥5K</span>
                            <span class="price-preset" data-max="10000">~¥10K</span>
                            <span class="price-preset" data-max="20000">~¥20K</span>
                        </div>
                    </div>
                    <div class="price-clear" id="priceClear">Clear price filter</div>
                </div>
            </div>
            <button class="btn btn-outline" id="famousBtn">🌟 Famous</button>
            <button class="btn btn-outline" id="scenicBtn">🏯 Scenic Spots</button>
            <span class="stats" id="stats">Loading...</span>
        </div>
    </div>

    <div class="main">
        <div id="map"></div>
        <div class="sidebar" id="sidebar">
            <div class="loading"><div class="spinner"></div><br>Loading restaurants...</div>
        </div>
    </div>

    <!-- Bottom Sheet Popup -->
    <div id="bs-backdrop"></div>
    <div id="bs-sheet" role="dialog" aria-hidden="true">
        <div id="bs-grip">
            <button id="bs-close" aria-label="Close">×</button>
        </div>
        <div id="bs-content"></div>
    </div>

    <script>
        // State
        let restaurants = [];
        let famousRestaurants = [];
        let scenicSpots = [];
        let markers = [];
        let userMarker = null;
        let userLat = null, userLng = null;
        let activeGenre = null;
        let searchTerm = '';
        let showFamous = false;
        let showScenic = false;
        // Price filter state: { lunch: {min, max}, dinner: {min, max} }
        let priceFilter = { lunch: null, dinner: null };
        let map, markersLayer, scenicLayer;

        // Initialize map
        map = L.map('map', { scrollWheelZoom: true, zoomControl: true }).setView([36.5, 138], 5);

        // Keyboard zoom
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === '+' || e.key === '=') map.zoomIn();
            if (e.key === '-' || e.key === '_') map.zoomOut();
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/">OpenStreetMap</a>',
            maxZoom: 18
        }).addTo(map);
        markersLayer = L.layerGroup().addTo(map);
        scenicLayer = L.layerGroup();

        // User location icon
        const userIcon = L.divIcon({
            html: '<div style="background:#4285F4;width:16px;height:16px;border-radius:50%;border:3px solid white;box-shadow:0 2px 6px rgba(0,0,0,0.3)"></div>',
            iconSize: [22, 22], iconAnchor: [11, 11], className: ''
        });

        // Create emoji marker for restaurants
        function createEmojiMarker(emoji, color, size = 32) {
            return L.divIcon({
                html: `<div class="emoji-marker" style="background:${color};font-size:${size * 0.56}px;width:${size}px;height:${size}px;">${emoji}</div>`,
                iconSize: [size, size], iconAnchor: [size/2, size/2], className: ''
            });
        }

        // Create scenic spot marker with name label
        function createScenicMarker(emoji, name) {
            // Use short name for label (English if short enough, else Japanese)
            const shortName = name.length > 12 ? name.substring(0, 11) + '…' : name;
            return L.divIcon({
                html: `<div class="scenic-marker-wrap"><div class="scenic-marker-icon">${emoji}</div><div class="scenic-marker-label">${shortName}</div></div>`,
                iconSize: [70, 44], iconAnchor: [35, 22], className: ''
            });
        }

        // Haversine distance
        function haversine(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2) ** 2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLng/2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // Parse budget string like "￥1,000～￥1,999" or "￥1,000" or "～￥3,000"
        // Returns { min, max } in yen, or null if unparseable
        function parseBudget(str) {
            if (!str || typeof str !== 'string') return null;
            const cleaned = str.replace(/[￥¥\s]/g, '').replace(/,/g, '');
            const parts = cleaned.split(/[～~—-]/);
            const nums = parts.map(p => parseInt(p.trim(), 10)).filter(n => !isNaN(n));
            if (nums.length === 0) return null;
            if (nums.length === 1) return { min: 0, max: nums[0] }; // "～￥3,000" means up to 3K
            return { min: nums[0], max: nums[1] };
        }

        // Check if a restaurant's budget falls within the price filter
        function priceMatches(budgetStr, filter) {
            if (!filter || !filter.min && !filter.max) return true;
            const budget = parseBudget(budgetStr);
            if (!budget) return true; // Can't parse, include by default
            // Check overlap: ranges overlap if budget.max >= filter.min && budget.min <= filter.max
            if (filter.min && filter.max) return budget.max >= filter.min && budget.min <= filter.max;
            if (filter.min) return budget.max >= filter.min;
            if (filter.max) return budget.min <= filter.max;
            return true;
        }

        // Decompress short-key data → full names
        const M = {n:'name',a:'area',g:'genre',u:'tabelog_url',i:'image_url',h:'holiday',nw:'is_new',la:'lat',lo:'lng',r:'rating',c:'review_count',bl:'budget_lunch',bd:'budget_dinner',p:'phone',rv:'reservable',addr:'address',st:'station_name',hr:'hours_raw',sg:'sub_genres',aw:'awards',wm:'walk_minutes'};
        const FM = {n:'name',ne:'name_en',g:'genre',a:'area',la:'lat',lo:'lng',r:'rating',sc:'saved_count',c:'review_count',bl:'budget_lunch',bd:'budget_dinner',p:'phone',rv:'reservable',hr:'hours_raw',u:'tabelog_url',i:'image_url',addr:'address',st:'station_name',em:'emoji',cl:'color'};
        const SM = {n:'name',nj:'name_ja',la:'lat',lo:'lng',cat:'category',em:'emoji',sc:'score'};
        function decompress(arr, map) { return arr.map(o => { const d = {}; for (const [k,v] of Object.entries(o)) { d[map[k]||k] = v; if (k==='id') d.id=v; } return d; }); }

        // Load all data with cache-busting to avoid stale GitHub Pages cache
        const v = Date.now();
        const loadStatus = document.querySelector('.loading');
        function updateStatus(msg) { if (loadStatus) loadStatus.innerHTML = `<div class="spinner"></div><br>${msg}`; }

        updateStatus('Downloading restaurant data (8MB)...');
        fetch('data.json?v=' + v)
            .then(r => { if (!r.ok) throw new Error(`data.json HTTP ${r.status}`); updateStatus('Parsing restaurant data...'); return r.json(); })
            .then(allRestaurants => {
                updateStatus('Loading famous restaurants...');
                restaurants = decompress(allRestaurants, M);
                console.log(`Loaded ${restaurants.length} restaurants`);
                return fetch('frontend/data/famous_restaurants.json?v=' + v);
            })
            .then(r => { if (!r.ok) throw new Error(`famous HTTP ${r.status}`); return r.json(); })
            .then(famous => {
                updateStatus('Loading scenic spots...');
                famousRestaurants = decompress(famous, FM);
                console.log(`Loaded ${famousRestaurants.length} famous spots`);
                return fetch('frontend/data/scenic_spots_famous.json?v=' + v);
            })
            .then(r => { if (!r.ok) throw new Error(`scenic HTTP ${r.status}`); return r.json(); })
            .then(scenic => {
                scenicSpots = decompress(scenic, SM);
                console.log(`Loaded ${scenicSpots.length} scenic spots`);
                updateStatus('Ready!');
                setTimeout(() => { if (loadStatus) loadStatus.remove(); }, 500);
                buildGenreMenu();
                filterAndDisplay();
            })
            .catch(err => {
                console.error('Data load error:', err);
                if (loadStatus) loadStatus.innerHTML = `<div class="empty-state">⚠️ Failed to load data: ${err.message}<br><small>Check browser console (F12) for details</small></div>`;
            });

        // Genre menu
        function buildGenreMenu() {
            const counts = {};
            restaurants.forEach(r => { counts[r.genre] = (counts[r.genre] || 0) + 1; });
            const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
            const menu = document.getElementById('genreMenu');
            menu.innerHTML = sorted.map(([genre, count]) =>
                `<div class="genre-menu-item" data-genre="${genre}">${genre}<span class="genre-count">${count}</span></div>`
            ).join('');
            menu.querySelectorAll('.genre-menu-item').forEach(el => {
                el.addEventListener('click', () => {
                    activeGenre = activeGenre === el.dataset.genre ? null : el.dataset.genre;
                    menu.querySelectorAll('.genre-menu-item').forEach(e => e.classList.toggle('active', e.dataset.genre === activeGenre));
                    filterAndDisplay();
                });
            });
        }

        // Filter and display
        function filterAndDisplay() {
            let filtered = restaurants;
            let cardType = 'restaurant';

            // Famous filter
            if (showFamous) {
                const famousIds = new Set(famousRestaurants.map(r => r.id));
                filtered = filtered.filter(r => famousIds.has(r.id));
            }

            // Genre filter
            if (activeGenre) filtered = filtered.filter(r => r.genre === activeGenre);

            // Search filter
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(r => r.name.toLowerCase().includes(term) || r.area.toLowerCase().includes(term));
            }

            // Price filter (lunch & dinner)
            if (priceFilter.lunch) {
                filtered = filtered.filter(r => priceMatches(r.budget_lunch, priceFilter.lunch));
            }
            if (priceFilter.dinner) {
                filtered = filtered.filter(r => priceMatches(r.budget_dinner, priceFilter.dinner));
            }

            // Sort by distance from map center
            const center = map.getCenter();
            filtered = filtered.map(r => ({...r, dist: haversine(center.lat, center.lng, r.lat, r.lng)}))
                .filter(r => r.dist !== null && !isNaN(r.dist))
                .sort((a, b) => a.dist - b.dist);

            // Update markers (limit for performance)
            updateMarkers(filtered);

            // Update scenic spots
            updateScenicMarkers();

            // Render cards
            if (showScenic && !showFamous) {
                renderScenicCards();
            } else {
                renderCards(filtered);
            }

            updateStats(filtered.length);
        }

        // Update restaurant markers
        function updateMarkers(list) {
            markersLayer.clearLayers();

            if (showFamous) {
                // Use emoji markers for famous restaurants
                const famousMap = {};
                famousRestaurants.forEach(r => famousMap[r.id] = r);

                list.slice(0, 500).forEach(r => {
                    const famous = famousMap[r.id];
                    const emoji = famous ? famous.emoji : '🍽️';
                    const color = famous ? famous.color : '#E44040';
                    const m = L.marker([r.lat, r.lng], { icon: createEmojiMarker(emoji, color) });
                    m.on('click', () => showRestaurantBottomSheet(r, famous));
                    markersLayer.addLayer(m);
                });
            } else {
                // Use simple red dots for all restaurants
                const restaurantIcon = L.divIcon({
                    html: '<div style="background:#E44040;width:12px;height:12px;border-radius:50%;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,0.2)"></div>',
                    iconSize: [16, 16], iconAnchor: [8, 8], className: ''
                });
                list.slice(0, 500).forEach(r => {
                    const m = L.marker([r.lat, r.lng], { icon: restaurantIcon });
                    m.bindPopup(`<div class="popup-content"><h4>${r.name}</h4><p>${r.area}</p><p>${r.genre}${r.dist !== undefined ? ` · ${r.dist.toFixed(1)}km` : ''}</p></div>`);
                    m.on('click', () => highlightCard(r.id));
                    markersLayer.addLayer(m);
                });
            }
        }

        // Update scenic spot markers
        function updateScenicMarkers() {
            scenicLayer.clearLayers();

            if (showScenic) {
                const center = map.getCenter();
                const zoom = map.getZoom();

                // Only show scenic spots within viewport + some margin
                const bounds = map.getBounds();
                const nearby = scenicSpots.filter(s =>
                    bounds.contains([s.lat, s.lng])
                );

                // Limit markers based on zoom level
                const maxMarkers = zoom >= 12 ? 500 : zoom >= 8 ? 200 : 50;
                nearby.slice(0, maxMarkers).forEach(s => {
                    const m = L.marker([s.lat, s.lng], { icon: createScenicMarker(s.emoji, s.name) });
                    m.on('click', () => showScenicBottomSheet(s));
                    scenicLayer.addLayer(m);
                });
            }
        }

        // Bottom sheet for restaurant
        function showRestaurantBottomSheet(r, famous) {
            const backdrop = document.getElementById('bs-backdrop');
            const sheet = document.getElementById('bs-sheet');
            const content = document.getElementById('bs-content');

            const photos = r.image_url ? `<div class="rst-photos"><a href="${r.image_url}" target="_blank" rel="noopener"><img src="${r.image_url}" loading="lazy" alt="${r.name}" onerror="this.parentElement.style.display='none'"></a></div>` : '';

            const reservable = r.reservable === true ? '可预订' : r.reservable === false ? '无法预订' : '';
            const dinnerPrice = famous ? famous.budget_dinner : (r.budget_dinner || '—');
            const lunchPrice = famous ? famous.budget_lunch : (r.budget_lunch || '—');
            const rating = r.rating ? `★${r.rating}` : '';
            const reviewCount = r.review_count ? `${r.review_count} reviews` : '';
            const savedCount = famous && famous.saved_count ? `${(famous.saved_count / 1000).toFixed(1)}K saves` : '';
            const station = r.station_name ? `📍 ${r.station_name}駅` : '';
            const address = r.address || '';
            const hours = r.hours_raw ? r.hours_raw.substring(0, 100) + (r.hours_raw.length > 100 ? '...' : '') : '';
            const phone = r.phone || '';

            content.innerHTML = `
                <div class="rst-card">
                    <div class="rst-header">
                        <div class="rst-title">${r.name}${rating ? `<span class="rst-rating">${rating}</span>` : ''}</div>
                        <div class="rst-actions">
                            <button class="rst-btn" onclick="window.open('${r.tabelog_url}', '_blank')">食べログ ↗</button>
                            <button class="rst-btn" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}', '_blank')">Directions ↗</button>
                        </div>
                    </div>
                    ${photos}
                    <div class="rst-genre">${r.genre}</div>
                    <div class="rst-info">
                        <div class="rst-info-row"><span class="rst-label">晚</span><span class="rst-value">${dinnerPrice}</span></div>
                        <div class="rst-info-row"><span class="rst-label">午</span><span class="rst-value">${lunchPrice}</span></div>
                        <div class="rst-info-row"><span class="rst-label">地址</span><span class="rst-value">${address}</span></div>
                        <div class="rst-info-row"><span class="rst-label">车站</span><span class="rst-value">${station}</span></div>
                        ${phone ? `<div class="rst-info-row"><span class="rst-label">电话</span><span class="rst-value">${phone}</span></div>` : ''}
                        ${hours ? `<div class="rst-info-row"><span class="rst-label">时间</span><span class="rst-value">${hours}</span></div>` : ''}
                    </div>
                    ${reservable ? `<div class="rst-policy">${reservable}</div>` : ''}
                    <div class="rst-footer">
                        <div>
                            ${savedCount ? `<span style="color:#FF6B00;font-weight:600;">🌟 ${savedCount}</span>` : ''}
                            ${reviewCount ? `<span style="color:#6b7280;font-size:12px;margin-left:8px;">${reviewCount}</span>` : ''}
                        </div>
                    </div>
                </div>
            `;

            backdrop.classList.add('bs-open');
            sheet.classList.add('bs-open');
            sheet.setAttribute('aria-hidden', 'false');
        }

        // Bottom sheet for scenic spot
        function showScenicBottomSheet(s) {
            const backdrop = document.getElementById('bs-backdrop');
            const sheet = document.getElementById('bs-sheet');
            const content = document.getElementById('bs-content');

            const osmUrl = `https://www.openstreetmap.org/${s.id.startsWith('osm_') ? 'node' : 'way'}/${s.id.replace('osm_', '')}`;

            content.innerHTML = `
                <div class="scenic-detail">
                    <div class="scenic-detail-header">
                        <div class="scenic-detail-emoji">${s.emoji}</div>
                        <div>
                            <div class="scenic-detail-title">${s.name}</div>
                            <div class="scenic-detail-subtitle">${s.name_ja}</div>
                        </div>
                    </div>
                    <div class="scenic-detail-info">
                        <div class="scenic-detail-row">
                            <span class="scenic-detail-label">类型</span>
                            <span class="scenic-detail-value">${s.category}</span>
                        </div>
                        <div class="scenic-detail-row">
                            <span class="scenic-detail-label">坐标</span>
                            <span class="scenic-detail-value">${s.lat.toFixed(6)}, ${s.lng.toFixed(6)}</span>
                        </div>
                    </div>
                    <div class="scenic-detail-footer">
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank" rel="noopener">Directions ↗</a>
                        <a href="${osmUrl}" target="_blank" rel="noopener">OpenStreetMap ↗</a>
                    </div>
                </div>
            `;

            backdrop.classList.add('bs-open');
            sheet.classList.add('bs-open');
            sheet.setAttribute('aria-hidden', 'false');
        }

        // Close bottom sheet
        function closeBottomSheet() {
            document.getElementById('bs-backdrop').classList.remove('bs-open');
            document.getElementById('bs-sheet').classList.remove('bs-open');
            document.getElementById('bs-sheet').setAttribute('aria-hidden', 'true');
        }
        document.getElementById('bs-close').addEventListener('click', closeBottomSheet);
        document.getElementById('bs-backdrop').addEventListener('click', closeBottomSheet);

        // Debounce helper
        function debounce(fn, delay) {
            let timer;
            return function(...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        }

        // Re-sort when user pans or zooms the map
        map.on('moveend zoomend', debounce(() => filterAndDisplay(), 300));

        function updateStats(count) {
            const total = showFamous ? famousRestaurants.length : restaurants.length;
            let scenicText = '';
            if (showScenic) {
                const bounds = map.getBounds();
                const visible = scenicSpots.filter(s => bounds.contains([s.lat, s.lng])).length;
                scenicText = ` | 🏯 ${visible} spots`;
            }
            document.getElementById('stats').textContent = `${count} of ${total}${scenicText}`;
        }

        function highlightCard(id) {
            document.querySelectorAll('.restaurant-card').forEach(c => c.classList.remove('highlighted'));
            const card = document.querySelector(`.restaurant-card[data-id="${id}"]`);
            if (card) { card.classList.add('highlighted'); card.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
        }

        function focusRestaurant(lat, lng, name) {
            map.panTo([lat, lng], { animate: true });
        }

        function renderCards(list) {
            const sidebar = document.getElementById('sidebar');
            if (list.length === 0) {
                sidebar.innerHTML = `<div class="empty-state">🔍 No restaurants found in this area</div>`;
                return;
            }

            const famousMap = {};
            if (showFamous) {
                famousRestaurants.forEach(r => famousMap[r.id] = r);
            }

            const display = list.slice(0, 200);
            sidebar.innerHTML = display.map(r => {
                const famous = famousMap[r.id];
                const famousBadge = famous ? `<span class="famous-badge">🌟 ${(famous.saved_count / 1000).toFixed(1)}K</span>` : '';
                return `
                    <div class="restaurant-card" data-id="${r.id}" onclick="focusRestaurant(${r.lat}, ${r.lng}, '${r.name.replace(/'/g, "\\'")}')">
                        <div class="card-header">
                            <img class="card-image" src="${r.image_url}" alt="${r.name}" loading="lazy" onerror="this.style.display='none'">
                            <div class="card-info">
                                <div class="card-name">${r.name}${r.is_new ? '<span class="new-badge">NEW</span>' : ''}${famousBadge}</div>
                                <div class="card-area">${r.area}${r.station_name ? ` · ${r.station_name}駅` : ''}</div>
                                <div class="card-meta">
                                    ${r.rating ? `<span>⭐ ${r.rating}</span>` : ''}
                                    ${r.review_count ? `<span>📝 ${r.review_count} reviews</span>` : ''}
                                    ${r.dist !== undefined ? `<span class="card-distance">📍 ${r.dist.toFixed(1)}km</span>` : ''}
                                </div>
                                <span class="card-genre">${r.genre}</span>
                            </div>
                        </div>
                        <div class="card-actions">
                            <a href="${r.tabelog_url}" target="_blank" rel="noopener">食べログ →</a>
                            <a href="https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}" target="_blank" rel="noopener">Directions →</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderScenicCards() {
            const sidebar = document.getElementById('sidebar');
            const bounds = map.getBounds();
            const nearby = scenicSpots.filter(s => bounds.contains([s.lat, s.lng]));

            // Sort by distance from map center
            const center = map.getCenter();
            const sorted = nearby.map(s => ({...s, dist: haversine(center.lat, center.lng, s.lat, s.lng)}))
                .sort((a, b) => a.dist - b.dist);

            if (sorted.length === 0) {
                sidebar.innerHTML = `<div class="empty-state">🔍 Zoom in to see scenic spots</div>`;
                return;
            }

            const display = sorted.slice(0, 100);
            const categoryEmoji = {
                'castle': '🏯', 'shrine': '⛩️', 'temple': '🛕', 'garden': '🌸',
                'museum': '🏛️', 'nature': '🌿', 'viewpoint': '👁️', 'attraction': '🎯',
                'historic': '📜', 'beach': '🏖️', 'onsen': '♨️'
            };

            sidebar.innerHTML = display.map(s => `
                <div class="scenic-card" onclick="focusRestaurant(${s.lat}, ${s.lng}, '${s.name.replace(/'/g, "\\'")}')">
                    <div class="scenic-header">
                        <div class="scenic-emoji">${s.emoji}</div>
                        <div class="scenic-info">
                            <div class="scenic-name">${s.name}</div>
                            <div class="scenic-name-ja">${s.name_ja}</div>
                            ${s.dist !== undefined ? `<div class="card-distance">📍 ${s.dist.toFixed(1)}km</div>` : ''}
                            <span class="scenic-category">${categoryEmoji[s.category] || '📍'} ${s.category}</span>
                        </div>
                    </div>
                    <div class="scenic-actions">
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}" target="_blank" rel="noopener">Directions →</a>
                    </div>
                </div>
            `).join('');
        }

        // Geolocation
        document.getElementById('locateBtn').addEventListener('click', () => {
            if (!navigator.geolocation) { alert('Geolocation is not supported by your browser'); return; }
            document.getElementById('locateBtn').textContent = '⏳ Locating...';
            navigator.geolocation.getCurrentPosition(
                pos => {
                    userLat = pos.coords.latitude;
                    userLng = pos.coords.longitude;
                    if (userMarker) map.removeLayer(userMarker);
                    userMarker = L.marker([userLat, userLng], { icon: userIcon }).addTo(map).bindPopup('You are here').openPopup();
                    map.setView([userLat, userLng], map.getZoom() < 10 ? 12 : map.getZoom());
                    document.getElementById('locateBtn').textContent = '📍 Near Me';
                },
                err => { alert('Could not get your location: ' + err.message); document.getElementById('locateBtn').textContent = '📍 Near Me'; },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        });

        // Search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchTerm = e.target.value.trim();
            filterAndDisplay();
        });

        // Genre dropdown toggle
        document.getElementById('genreBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('genreMenu').classList.toggle('show');
        });
        document.addEventListener('click', () => {
            document.getElementById('genreMenu').classList.remove('show');
            document.getElementById('priceMenu').classList.remove('show');
        });
        document.getElementById('genreMenu').addEventListener('click', (e) => e.stopPropagation());

        // Price dropdown toggle
        document.getElementById('priceBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('priceMenu').classList.toggle('show');
        });
        document.getElementById('priceMenu').addEventListener('click', (e) => e.stopPropagation());

        // Price filter: lunch min/max inputs
        ['lunchMin', 'lunchMax', 'dinnerMin', 'dinnerMax'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                const lm = parseInt(document.getElementById('lunchMin').value) || 0;
                const lx = parseInt(document.getElementById('lunchMax').value) || 0;
                const dm = parseInt(document.getElementById('dinnerMin').value) || 0;
                const dx = parseInt(document.getElementById('dinnerMax').value) || 0;
                priceFilter.lunch = (lm || lx) ? { min: lm, max: lx || Infinity } : null;
                priceFilter.dinner = (dm || dx) ? { min: dm, max: dx || Infinity } : null;
                // Update active state of price button
                document.getElementById('priceBtn').classList.toggle('active', !!(priceFilter.lunch || priceFilter.dinner));
                filterAndDisplay();
            });
        });

        // Price preset buttons
        ['lunchPresets', 'dinnerPresets'].forEach(presetId => {
            document.querySelectorAll(`#${presetId} .price-preset`).forEach(btn => {
                btn.addEventListener('click', () => {
                    const isLunch = presetId === 'lunchPresets';
                    const maxVal = parseInt(btn.dataset.max);
                    const minId = isLunch ? 'lunchMin' : 'dinnerMin';
                    const maxId = isLunch ? 'lunchMax' : 'dinnerMax';
                    document.getElementById(minId).value = '';
                    document.getElementById(maxId).value = maxVal;
                    // Toggle active class
                    document.querySelectorAll(`#${presetId} .price-preset`).forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    // Trigger filter
                    document.getElementById(maxId).dispatchEvent(new Event('input'));
                });
            });
        });

        // Clear price filter
        document.getElementById('priceClear').addEventListener('click', () => {
            document.getElementById('lunchMin').value = '';
            document.getElementById('lunchMax').value = '';
            document.getElementById('dinnerMin').value = '';
            document.getElementById('dinnerMax').value = '';
            priceFilter.lunch = null;
            priceFilter.dinner = null;
            document.getElementById('priceBtn').classList.remove('active');
            document.querySelectorAll('.price-preset').forEach(b => b.classList.remove('active'));
            filterAndDisplay();
        });

        // Famous toggle
        document.getElementById('famousBtn').addEventListener('click', () => {
            showFamous = !showFamous;
            document.getElementById('famousBtn').classList.toggle('active', showFamous);
            filterAndDisplay();
        });

        // Scenic spots toggle
        document.getElementById('scenicBtn').addEventListener('click', () => {
            showScenic = !showScenic;
            document.getElementById('scenicBtn').classList.toggle('active-scenic', showScenic);
            if (showScenic) {
                scenicLayer.addTo(map);
            } else {
                map.removeLayer(scenicLayer);
            }
            filterAndDisplay();
        });

        // Address/city search
        let addressTimeout = null;
        document.getElementById('addressInput').addEventListener('input', (e) => {
            clearTimeout(addressTimeout);
            const query = e.target.value.trim();
            if (query.length < 2) return;
            addressTimeout = setTimeout(() => {
                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Japan')}&limit=1`)
                    .then(r => r.json())
                    .then(results => {
                        if (results.length > 0) {
                            const { lat, lon, display_name } = results[0];
                            userLat = parseFloat(lat);
                            userLng = parseFloat(lon);
                            if (userMarker) map.removeLayer(userMarker);
                            userMarker = L.marker([userLat, userLng], { icon: userIcon }).addTo(map).bindPopup(display_name).openPopup();
                            map.setView([userLat, userLng], 13);
                        }
                    })
                    .catch(err => console.error('Address search failed:', err));
            }, 800);
        });
        document.getElementById('addressInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                clearTimeout(addressTimeout);
                e.target.dispatchEvent(new Event('input'));
            }
        });
    </script>
</body>
</html>
